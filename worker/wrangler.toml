name = "takumi-kogyo-chat"
main = "src/index.js"
compatibility_date = "2026-11-01"

# KV の id は、作成したあとに wrangler kv namespace create KV の結果で置き換える
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

[vars]
ALLOWED_ORIGINS = "https://takumikougyou1105.co.jp"
LIMIT_PER_IP_HOUR = "20"   # 1時間にIPごと(チャット+フォームの合計)
LIMIT_PER_DAY = "300"      # 1日に全体で。費用の上限の目安(Sonnetで1回あたり数円)
NOTIFY_EMAIL_TO = "takumikougyou.1105@gmail.com"

# 秘密は wrangler secret put で入れる(コードにも設定ファイルにも書かない):
#   ANTHROPIC_API_KEY  チャット専用に新しく作ったキー(Consoleで月の上限を付ける)
#   NOTIFY_TOKEN       新右衛門が受信箱を取りに来るときの合言葉
#   RESEND_API_KEY     (任意)Gmail への通知
#   LINE_CHANNEL_TOKEN, LINE_USER_ID  (任意)LINE への通知
